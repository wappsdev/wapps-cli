name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    # macOS: the darwin targets build natively and the musl targets link with
    # zig, the same host the release was proven on (docs/PORT-kalan-yuzey.md,
    # "Release switch").
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Rust targets and the zig linker
        working-directory: rust
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-musl x86_64-unknown-linux-musl
          brew install zig cargo-zigbuild
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Used by .goreleaser.yml `homebrew_casks[].repository.token` template substitution
          # (cross-repo push to wappsdev/homebrew-tap; auto GITHUB_TOKEN scope insufficient).
          HOMEBREW_TAP_PAT: ${{ secrets.HOMEBREW_TAP_PAT }}
