[package]
name = "wapps"
version = "0.23.0"
edition = "2021"
publish = false

[lib]
name = "wapps"
path = "src/lib.rs"

[[bin]]
name = "wapps"
path = "src/main.rs"

[dependencies]
# clap: derive is used, but `///` help comments are prohibited (see helptext.rs).
clap = { version = "4", features = ["derive", "string"] }
serde = { version = "1", features = ["derive"] }
# raw_value is Go's json.RawMessage equivalent. The exec environment builder
# carries non-string values as raw bytes after TrimSpace: `[1, 2]` must retain
# its spaces. Value loses them: measured output was `K=[1,2]` versus Go's
# `K=[1, 2]`. This is a feature, not a new crate.
# float_roundtrip preserves finite numeric ingress precision; the default
# best-effort parser changed quota reset bits and extreme window labels.
# It adds no dependency. See tests/json_ingress_precision.rs for boundaries;
# this does not provide unrestricted JS acceptance or serialization parity.
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }
# ureq is blocking, not async. This is dependency policy, not a performance
# preference: an async client would introduce tokio, which this estate bans.
# Measurement found no tokio/mio/socket2 in ureq's graph; no ban was relaxed.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
# Whether stdin is a TTY is the axis of agent mode.
rustix = { version = "0.38", features = ["termios", "stdio", "fs", "process"] }
# rustls / webpki-roots / rustls-pki-types already belonged to ureq's graph
# through tls. They are direct dependencies only to construct the root store
# manually (store.rs, root_store): ureq supplies embedded roots but no way to
# augment them. Versions match ureq's requirements. Measurement added no crate
# to Cargo.lock (the historical graph remained at 93 crates).
#
# rustls-native-certs and rustls-pemfile are intentionally absent. The measured
# platform-store option added six crates on Darwin and failed cargo deny:
# rustls-pemfile was unmaintained without a safe upgrade. PEM reading instead
# uses rustls-pki-types' PemObject, the path identified by RUSTSEC-2025-0134.
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
# PemObject::pem_file_iter requires std; std = ["alloc"] adds no dependency.
rustls-pki-types = { version = "1", features = ["std"] }
webpki-roots = "0.26"
# serde_yaml_ng parses .wapps.yaml; Go uses gopkg.in/yaml.v3. This was a
# dependency-policy decision measured against a 93-crate baseline, deny exit 0:
#
#   candidate       crate delta   deny exit   result
#   serde_yaml      +6            0           REJECTED: 0.9.34+deprecated;
#                                             archived by dtolnay in 2024.
#                                             No then-current advisory (the
#                                             2018-0005 entry was fixed in
#                                             >=0.8.4); maintenance was the
#                                             measured reason for rejection.
#   serde_yaml_ng   +6            0           CHOSEN (see below).
#   serde_yml       +8            1           REJECTED: RUSTSEC-2025-0068,
#                                             unsound and unmaintained, no
#                                             patched version. This estate
#                                             does not permanently suppress
#                                             such advisories with ignore.
#   saphyr          +10           0           REJECTED: no serde integration
#                                             and the largest graph.
#   yaml-rust2      +6            0           REJECTED: no serde integration.
#
# serde_yaml_ng is the maintained serde_yaml fork with the same API. Serde
# derive maps Go struct tags directly: Prefix *string's absent/explicit-empty
# distinction maps to Option<String>. saphyr/yaml-rust2 would require manual
# mapping at precisely the boundary where a port could silently diverge.
#
# The six added crates were equivalent, hashbrown, indexmap, ryu,
# serde_yaml_ng and unsafe-libyaml. RUSTSEC-2023-0075 (unaligned u64 writes)
# in unsafe-libyaml was fixed in >=0.2.10 (resolved: 0.2.11) and only affects
# 32/16-bit targets; none of deny.toml's four triples belongs to that set.
serde_yaml_ng = "0.10"
# ring provides binding fingerprints' SHA-256 (binding.rs). Measurement added
# no crate: rustls already enabled ring (Cargo.lock: 0.17.14). The version
# matches that dependency, as for rustls-pki-types. sha2 would add three crates
# and a second cryptographic audit surface beside the existing library.
ring = "0.17"
# clap_complete: `wapps completion <shell>` (owner decision 2026-10-05,
# docs/PORT-kalan-yuzey.md §4.2: keep completion, generate it with
# clap_complete, install it from the Homebrew formula). Measured the same way
# as serde_yaml_ng above (base: 99 crates, `cargo deny check` = 0):
#
#   candidate                   crate delta   deny check   result
#   clap_complete 4.6.11        +1            0            CHOSEN: from the clap
#                                                          maintainers, generates
#                                                          the four shells cobra
#                                                          offers from the same
#                                                          clap tree the parser
#                                                          uses, so a new verb is
#                                                          in the next script
#   (embedded cobra scripts)    0             -            REJECTED by the owner:
#                                                          frozen bytes go stale
#                                                          as verbs are added
#
# Only the stable, ahead-of-time generators are used. The `unstable-dynamic`
# feature (the binary answering each Tab, as cobra's `__complete` does) is NOT
# enabled: its API is explicitly unstable, and it offers flags on an empty word
# too, so it would not close the bash divergence the static script has (slice
# record in the doc). No default features; the +1 is clap_complete alone (its
# one dependency without that feature, clap, was already in the graph).
clap_complete = "4"

# URL parsing and path-segment encoding for the broker; already in ureq's graph.
url = "2"

# POSIX sigaction for graceful daemon shutdown on macOS and Linux. Already in
# the rustix/ring dependency graph; no new package is introduced.
libc = "0.2"

[dev-dependencies]
# Test support from this workspace (no package enters the lock): the tests that
# write a shim and run it at once write it through
# `broker_oracle::exe::write_executable`, so Linux cannot refuse it with
# ETXTBSY while a sibling test's fork holds the write descriptor.
broker-oracle = { path = "../broker-oracle", version = "0.0.0" }
