[package]
name = "wapps"
version = "0.23.0"
edition = "2021"
publish = false

[lib]
name = "wapps"
path = "src/lib.rs"

[[bin]]
name = "wapps"
path = "src/main.rs"

[dependencies]
# clap: derive KULLANILIYOR ama `///` doc yorumlari YASAK (bkz. helptext.rs).
clap = { version = "4", features = ["derive", "string"] }
serde = { version = "1", features = ["derive"] }
# raw_value: Go'nun `json.RawMessage`inin karsiligi. GEREKLI, cunku exec'in
# env kurucusu string-olmayan bir degeri HAM bayt olarak tasiyor (yalnizca
# TrimSpace) — `[1, 2]` bosluguyla kaliyor. serde_json::Value bu bosluk
# bilgisini KAYBEDIYOR ve olculdu: onsuz `K=[1,2]` uretiliyordu, Go ise
# `K=[1, 2]`. Bir OZELLIK, yeni crate DEGIL.
serde_json = { version = "1", features = ["raw_value"] }
# ureq: BLOKLAYAN (async degil) HTTP istemcisi. Bu bir performans tercihi degil
# bir BAGIMLILIK POLITIKASI tercihi: async bir istemci tokio'yu grafige sokardi
# ve tokio bu estate'te yasakli. Olculdu: ureq'in grafiginde tokio/mio/socket2
# YOK, yani yasagi gevsetmeye gerek kalmiyor.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
# stdin'in TTY olup olmadigi — agentmode'un ekseni.
rustix = { version = "0.38", features = ["termios", "stdio", "fs", "process"] }
# rustls / webpki-roots / rustls-pki-types: HEPSI zaten `ureq`in grafiginde vardi
# (asagidaki `tls` ozelligi getiriyor). Burada DOGRUDAN bagimlilik yapilmalarinin
# tek sebebi kok deposunu ELDE KURMAK (store.rs, `root_store`): `ureq`in
# varsayilani gomulu kokleri VERIYOR ama uzerine ekleme yapmanin yolunu vermiyor.
# Surumler `ureq`in istedikleriyle BIREBIR ayni tutuldu — amac Cargo.lock'a tek
# bir yeni crate sokmamak, ve olculdu: sokmuyor (93 crate, oncesiyle ayni).
#
# `rustls-native-certs` ve `rustls-pemfile` BILEREK YOK. Platform deposunu okuma
# sikki (B) olculdu: darwin'de alti crate ekliyor ve `cargo deny`yi dusuruyor
# (`rustls-pemfile` bakimsiz, guvenli yukseltme yok). PEM okumasi bunun yerine
# `rustls-pki-types`in kendi `PemObject`i uzerinden yapiliyor — RUSTSEC-2025-0134
# duyurusunun isaret ettigi yol.
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
# `std`: `PemObject::pem_file_iter` bu ozelligin arkasinda. Yeni bagimlilik
# getirmiyor (`std = ["alloc"]`).
rustls-pki-types = { version = "1", features = ["std"] }
webpki-roots = "0.26"
# serde_yaml_ng: `.wapps.yaml` ayristiricisi. Go tarafi gopkg.in/yaml.v3
# kullaniyor; Rust'ta bu bir BAGIMLILIK POLITIKASI karari, o yuzden adaylar
# HATIRLANMADI, OLCULDU (taban: 93 crate, `cargo deny check` = 0):
#
#   aday            crate delta   deny check   sonuc
#   serde_yaml      +6            0            ELENDI: surumun kendisi
#                                              "0.9.34+deprecated"; dtolnay 2024'te
#                                              arsivledi. RUSTSEC'te BUGUN bir
#                                              duyuru YOK (tek kayit 2018-0005,
#                                              >=0.8.4'te yamali) — yani deny'i
#                                              gecerdi. Elenme sebebi olculen
#                                              BAKIM durumu, bir duyuru degil.
#   serde_yaml_ng   +6            0            SECILDI (bkz. asagi)
#   serde_yml       +8            1            ELENDI: RUSTSEC-2025-0068,
#                                              "unsound and unmaintained",
#                                              patched=[] — yani `ignore` YAZMADAN
#                                              gecirmenin yolu YOK. Bu estate bir
#                                              guvenlik/bakim duyurusunu kalici
#                                              susturan ignore yazmiyor
#                                              (rustls-pemfile'da da yazmadi).
#   saphyr          +10           0            ELENDI: serde entegrasyonu yok +
#                                              en buyuk graf.
#   yaml-rust2      +6            0            ELENDI: serde entegrasyonu yok.
#
# serde_yaml_ng, serde_yaml'in BAKIMI SUREN catali ve API'si birebir ayni.
# serde derive'i tasidigi icin Go'nun struct etiketleri Rust alanlarina
# DOGRUDAN esleniyor — ozellikle `Prefix *string`in "yok" / "acikca bos" ayrimi
# `Option<String>`e birebir dusuyor. saphyr/yaml-rust2 ile bu eslemeyi ELDE
# yazmak gerekirdi ve bir portun sessizce ayrisacagi yer tam olarak orasidir.
#
# Grafa giren 6 crate: equivalent, hashbrown, indexmap, ryu, serde_yaml_ng,
# unsafe-libyaml. unsafe-libyaml icin RUSTSEC-2023-0075 (hizalanmamis u64
# yazimi) VAR ama >=0.2.10'da yamali (cozulen: 0.2.11) ve duyuru zaten yalnizca
# 32/16-bit hedefleri etkiliyor — deny.toml'daki dort ucluden hicbiri o kumede.
serde_yaml_ng = "0.10"
# ring: baglama parmak izinin SHA-256'si (binding.rs). Grafa YENI crate
# SOKMUYOR ve bu olculdu: `rustls`in `ring` ozelligi onu zaten getiriyordu
# (Cargo.lock'ta 0.17.14). Surum onunla BIREBIR ayni tutuldu — rustls-pki-types
# icin verilen kararin aynisi. Alternatif `sha2` grafa uc crate eklerdi ve bu
# ikilide zaten bir kripto kutuphanesi varken ikinciyi tasimak, iki ayri
# denetim yuzeyi demek olurdu.
ring = "0.17"
# clap_complete: `wapps completion <shell>` (owner decision 2026-10-05,
# docs/PORT-kalan-yuzey.md §4.2: keep completion, generate it with
# clap_complete, install it from the Homebrew formula). Measured the same way
# as serde_yaml_ng above (base: 99 crates, `cargo deny check` = 0):
#
#   candidate                   crate delta   deny check   result
#   clap_complete 4.6.11        +1            0            CHOSEN: from the clap
#                                                          maintainers, generates
#                                                          the four shells cobra
#                                                          offers from the same
#                                                          clap tree the parser
#                                                          uses, so a new verb is
#                                                          in the next script
#   (embedded cobra scripts)    0             -            REJECTED by the owner:
#                                                          frozen bytes go stale
#                                                          as verbs are added
#
# Only the stable, ahead-of-time generators are used. The `unstable-dynamic`
# feature (the binary answering each Tab, as cobra's `__complete` does) is NOT
# enabled: its API is explicitly unstable, and it offers flags on an empty word
# too, so it would not close the bash divergence the static script has (slice
# record in the doc). No default features; the +1 is clap_complete alone (its
# one dependency without that feature, clap, was already in the graph).
clap_complete = "4"

# URL parsing and path-segment encoding for the broker; already in ureq's graph.
url = "2"

[dev-dependencies]
# Test support from this workspace (no package enters the lock): the tests that
# write a shim and run it at once write it through
# `broker_oracle::exe::write_executable`, so Linux cannot refuse it with
# ETXTBSY while a sibling test's fork holds the write descriptor.
broker-oracle = { path = "../broker-oracle", version = "0.0.0" }
